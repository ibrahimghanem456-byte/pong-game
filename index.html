<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --line: #dfe7ff;
      --text: #eef4ff;
      --accent: #7dd3fc;
      --score: #fbbf24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #15213b, var(--bg));
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .game-wrapper {
      background: var(--panel);
      border: 3px solid var(--line);
      box-shadow: 0 0 30px rgba(125, 211, 252, 0.15);
      border-radius: 10px;
      padding: 15px;
    }

    canvas {
      display: block;
      background: #0a0f1a;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.08);
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 28px;
      margin-bottom: 12px;
      letter-spacing: 2px;
      color: var(--score);
      text-shadow: 0 0 8px rgba(251,191,36,0.4);
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="scoreboard">
      <span id="leftScore">0</span>
      <span>:</span>
      <span id="rightScore">0</span>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");

    const paddleWidth = 14;
    const paddleHeight = 100;
    const paddleSpeed = 7;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: paddleSpeed
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5.2
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 8,
      speed: 5,
      vx: 4,
      vy: 4
    };

    let leftScore = 0;
    let rightScore = 0;

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = event.clientY - rect.top;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = true;
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = false;
      }
    });

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.2 - 0.6);
      const speed = ball.speed + 0.2;

      ball.vx = direction * speed * Math.cos(angle + Math.PI / 4);
      ball.vy = speed * Math.sin(angle + Math.PI / 4);

      if (Math.abs(ball.vx) < 2) ball.vx = 4 * direction;
      if (Math.abs(ball.vy) < 2) ball.vy = 4 * (Math.random() > 0.5 ? 1 : -1);
    }

    function updateLeftPaddle() {
      if (keys.ArrowUp) {
        leftPaddle.y -= leftPaddle.speed;
      }
      if (keys.ArrowDown) {
        leftPaddle.y += leftPaddle.speed;
      }

      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    }

    function updateRightPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      const difference = targetY - rightPaddle.y;
      rightPaddle.y += difference * 0.12;
      rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }

      if (
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.y >= leftPaddle.y &&
        ball.y <= leftPaddle.y + leftPaddle.height &&
        ball.vx < 0
      ) {
        const hitPosition = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius;
        ball.vx = Math.abs(ball.vx) + 0.2;
        ball.vy = ball.vy + hitPosition * 4;
      }

      if (
        ball.x + ball.radius >= rightPaddle.x &&
        ball.y >= rightPaddle.y &&
        ball.y <= rightPaddle.y + rightPaddle.height &&
        ball.vx > 0
      ) {
        const hitPosition = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        ball.x = rightPaddle.x - ball.radius;
        ball.vx = -Math.abs(ball.vx) - 0.2;
        ball.vy = ball.vy + hitPosition * 4;
      }

      if (ball.x < 0) {
        rightScore++;
        rightScoreEl.textContent = rightScore;
        resetBall(1);
      } else if (ball.x > canvas.width) {
        leftScore++;
        leftScoreEl.textContent = leftScore;
        resetBall(-1);
      }
    }

    function drawNet() {
      for (let y = 0; y < canvas.height; y += 25) {
        ctx.fillStyle = "#dfe7ff";
        ctx.fillRect(canvas.width / 2 - 2, y, 4, 15);
      }
    }

    function drawPaddle(x, y, width, height) {
      ctx.fillStyle = "#7dd3fc";
      ctx.fillRect(x, y, width, height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f8fafc";
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0a0f1a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawNet();
      drawPaddle(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      drawPaddle(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
      drawBall();
    }

    function gameLoop() {
      updateLeftPaddle();
      updateRightPaddle();
      updateBall();
      draw();
      requestAnimationFrame(gameLoop);
    }

    resetBall(1);
    gameLoop();
  </script>
</body>
</html>
